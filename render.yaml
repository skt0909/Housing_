services:
  - type: web
    name: housing-dashboard
    runtime: python
    buildCommand: "bash build.sh && pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MYSQL_HOST
        sync: false   # set in Render dashboard
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
